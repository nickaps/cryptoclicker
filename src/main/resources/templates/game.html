<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Game</title>

    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/game.css">

    <script th:inline="javascript">
        window.addEventListener("DOMContentLoaded", () => {
            document.getElementById("score").textContent = 0;
        });
    </script>

    <script th:src="@{/scripts/game.js}" defer></script>
</head>

<body>

<h2 class="title-bar">Crypto Clicker</h2>

<p class="player-label">
    Playing as: <span th:text="${currentUserName}">Guest</span>
</p>

<div id="scoreboard">
    Crypto: <span id="score">0</span>
</div>

<div id="game">

    <div class="clickSection">
        <button class="crypto" onclick="addScore()">Click Here!</button>

        <p id="clickValueDisplay">
            Click Value: 1
        </p>
    </div>

    <div class="rigShop">
        Mining Rig Shop

        <div class="price">
            Hover over the shop items to see their price and how many you have!
        </div>

        <div class="items">
            <button data-item="mk1"></button>
            <button data-item="mk2"></button>
            <button data-item="mk3"></button>
            <button data-item="mk4"></button>
            <button data-item="mk5"></button>
            <button data-item="mk6"></button>
            <button data-item="mk7"></button>
            <button data-item="mk8"></button>
            <button data-item="mk9"></button>
            <button data-item="mk10"></button>
            <button data-item="mk11"></button>
            <button data-item="mk12"></button>
        </div>

        <div class="inventory">
            <h3>Inventory</h3>

            <p id="inventoryList">
                No rigs purchased yet.
            </p>
        </div>

        <div id="secretUpgrade" style="display:none;">
            <button onclick="buyClickUpgrade()">
                Secret Click Upgrade - $25 Million
            </button>
        </div>

    </div>


    <div class="upgradeShop">
        Upgrade Shop

        <div class="leftPrice">
            Hover over the shop items to see their price. These double mining rig production!
        </div>

        <div class="leftItems">
            <button data-item="mk1"></button>
            <button data-item="mk2"></button>
            <button data-item="mk3"></button>
            <button data-item="mk4"></button>
            <button data-item="mk5"></button>
            <button data-item="mk6"></button>
            <button data-item="mk7"></button>
            <button data-item="mk8"></button>
            <button data-item="mk9"></button>
            <button data-item="mk10"></button>
            <button data-item="mk11"></button>
            <button data-item="mk12"></button>
        </div>

    </div>

</div>

<div class="content">
    <div class="info">
        <p id="testLabel">Start Clicking!</p>
        <a href="#" onclick="exitGame()">Back</a>
    </div>
</div>

</body>
</html>
